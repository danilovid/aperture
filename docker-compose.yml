services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aperture
      POSTGRES_PASSWORD: aperture
      POSTGRES_DB: aperture
    ports:
      - "5432:5432"
    volumes:
      - aperture_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aperture"]
      interval: 5s
      timeout: 5s
      retries: 5

  aperture:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://aperture:aperture@postgres:5432/aperture?sslmode=disable
      # Empty unless the ner profile is up; the stage stays off without it.
      NER_URL: ${NER_URL-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Local model for names and addresses. Off by default — it is a much heavier
  # image than the gateway. Start it with:
  #   NER_URL=http://ner:8081 docker compose --profile ner up -d
  ner:
    build: ./ner
    profiles: ["ner"]
    expose:
      - "8081"
    ports:
      - "8081:8081"
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_APERTURE_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - aperture
    restart: unless-stopped

volumes:
  aperture_pgdata:
