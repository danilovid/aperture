# Mutegate on your own machine: gateway, console and database.
#
#   docker compose up -d
#   open http://localhost:5173 and sign up
#
# Everything listens on 127.0.0.1 only, which is why sign-up is open by
# default: the only people who can reach it are on this machine. For a
# server, use docker-compose.prod.yml (docs/DEPLOY.md).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mutegate
      POSTGRES_PASSWORD: mutegate
      POSTGRES_DB: mutegate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mutegate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mutegate"]
      interval: 5s
      timeout: 5s
      retries: 5

  mutegate:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://mutegate:mutegate@postgres:5432/mutegate?sslmode=disable
      # Invitation links point at the console, not at the gateway.
      PUBLIC_URL: http://localhost:5173
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      # Empty unless the ner profile is up; the stage stays off without it.
      NER_URL: ${NER_URL-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Local model for names and addresses. Off by default — it is a much heavier
  # image than the gateway. Start it with:
  #   NER_URL=http://ner:8081 docker compose --profile ner up -d
  ner:
    build: ./ner
    profiles: ["ner"]
    expose:
      - "8081"
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_MUTEGATE_URL: http://localhost:8080
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - mutegate
    restart: unless-stopped

volumes:
  mutegate_pgdata:
