# Mutegate on a server: gateway, console and database. Settings come from a
# .env file next to this one — see docs/DEPLOY.md:
#
#   PUBLIC_URL=http://YOUR_IP:8081
#   ADMIN_API_KEY=…                 (openssl rand -hex 24)
#   MUTEGATE_ENCRYPTION_KEY=…       (openssl rand -hex 32)
#
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mutegate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mutegate}
      POSTGRES_DB: mutegate
    # No published port: only the gateway talks to it.
    volumes:
      - mutegate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mutegate"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mutegate:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://mutegate:${POSTGRES_PASSWORD:-mutegate}@postgres:5432/mutegate?sslmode=disable
      PUBLIC_URL: ${PUBLIC_URL-}
      ADMIN_API_KEY: ${ADMIN_API_KEY-}
      MUTEGATE_ENCRYPTION_KEY: ${MUTEGATE_ENCRYPTION_KEY-}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_MUTEGATE_URL: /api
    ports:
      - "8081:80"
    depends_on:
      - mutegate
    restart: unless-stopped

volumes:
  mutegate_pgdata:
