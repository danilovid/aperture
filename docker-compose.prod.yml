services:
  mutegate:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_MUTEGATE_URL: /api
    ports:
      - "8081:80"
    depends_on:
      - mutegate
    restart: unless-stopped
